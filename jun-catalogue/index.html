<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Clock Image Library</title>
    <style>
      body {
        font-family: Arial;
        margin: 0;
        background: #f5f5f5
      }

      .header {
        background: #222;
        color: #fff;
        padding: 15px;
        text-align: center
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 20px;
        padding: 20px
      }

      .card,
      .imgcard {
        background: #fff;
        border-radius: 10px;
        padding: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, .1)
      }

      button {
        width: 100%;
        padding: 10px;
        border: 0;
        border-radius: 5px;
        background: #0d6efd;
        color: #fff;
        cursor: pointer
      }

      img {
        width: 100%;
        height: 220px;
        object-fit: contain
      }

      #gallery {
        display: none;
        padding: 20px
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h2>Clock Image Library</h2>
    </div>
    <div id="folders" class="grid"></div>
    <div id="gallery">
      <button onclick="back()">Back</button>
      <h3 id="title"></h3>
      <div id="imgs" class="grid"></div>
    </div>
    <script>
      const data = {
        "Big-Rajwadi-Gold": ["01.png", "02.png", "03.png", "04.png"],
        "guitar-copper": ["01.png", "02.png", "03.png", "04.png"],
        "guitar-golden": ["01.png", "02.png", "03.png", "04.png"],
        "guitar-silver": ["01.png", "02.png", "03.png", "04.png"],
        "guitar-wood": ["01.png", "02.png", "03.png", "04.png"],
        "hores-grey": ["01.png", "02.png", "03.png", "04.png"],
        "hores-oxy-copper": ["01.png", "02.png", "03.png", "04.png"],
        "hores-rani-pink": ["01.png", "02.png", "03.png", "04.png"],
        "horse-cherry": ["01.png", "02.png", "03.png", "04.png"],
        "horse-golden": ["01.png", "02.png", "03.png", "04.png"],
        "horse-oxydize-silver": ["01.png", "02.png", "03.png", "04.png"],
        "horse-red": ["01.png", "02.png", "03.png", "04.png"],
        "horse-silver": ["01.png", "02.png", "03.png", "04.png"],
        "horse-wooden": ["01.png", "02.png", "03.png", "04.png"],
        "peacock-copper": ["01.png", "02.png", "03.png", "04.png"],
        "peacock-golden": ["01.png", "02.png", "03.png", "04.png"],
        "peacock-silver": ["01.png", "02.png", "03.png", "04.png"],
        "peacock-wood": ["01.png", "02.png", "03.png", "04.png"],
      };
      const root = "./";
      const folders = document.getElementById('folders');
      for (let f in data) {
        folders.innerHTML += `
          <div class="card">
            <h3>${f}</h3>
            <button onclick="openFolder('${f}')">Open</button>
          </div>`;
      }

function openFolder(f) {

    document.getElementById('title').innerText = f;
    folders.style.display = 'none';
    gallery.style.display = 'block';

    let h = '';

    data[f].forEach(img => {

        let imagePath = `${root}${f}/${img}`;
        let url = new URL(imagePath, window.location.href).href;

        h += `
        <div class="imgcard">
            <img src="${imagePath}" alt="${img}" loading="lazy">
            <button onclick="copyUrl('${url}')">
                Copy URL
            </button>
        </div>`;
    });

    imgs.innerHTML = h;
}

function copyUrl(url) {
    navigator.clipboard.writeText(url);
    alert('URL Copied:\n' + url);
}

function back() {
    gallery.style.display = 'none';
    folders.style.display = 'grid';
}

      function back() {
        gallery.style.display = 'none';
        folders.style.display = 'grid';
      }
    </script>
  </body>
</html>
